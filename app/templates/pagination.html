{% if pagination is defined and pagination.pages > 1 %}
<nav class="d-flex justify-content-center gap-3 mt-4" aria-label="Pages">
  {% if pagination.has_prev %}<a href="{{ url_for(request.endpoint, page=pagination.prev_num, q=request.args.get('q', ''), category=request.args.get('category', '')) }}">Previous</a>{% endif %}
  <span>Page {{ pagination.page }} of {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a href="{{ url_for(request.endpoint, page=pagination.next_num, q=request.args.get('q', ''), category=request.args.get('category', '')) }}">Next</a>{% endif %}
</nav>
{% endif %}
