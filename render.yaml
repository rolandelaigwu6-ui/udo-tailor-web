# SQLite and uploads require a paid web service and persistent disk.
services:
  - type: web
    name: udo-tailor-web
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: sh scripts/build-render.sh
    startCommand: sh scripts/start-render.sh
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: tailor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/tailor.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: FLASK_DEBUG
        value: "0"
