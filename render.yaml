# Free web hosting. Persistent database and images live in Supabase Free.
services:
  - type: web
    name: udo-tailor-web
    runtime: python
    plan: free
    buildCommand: sh scripts/build-render.sh
    startCommand: sh scripts/start-render.sh
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: REQUIRE_EXTERNAL_STORAGE
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: tailor-images
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: FLASK_DEBUG
        value: "0"
